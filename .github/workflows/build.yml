name: Build

# Jeder Push auf main: Windows + macOS bauen, Artefakte hochladen und – sobald das Secret
# TAURI_SIGNING_PRIVATE_KEY eingetragen ist – ein GitHub-Release v1.0.<Lauf> mit latest.json
# für den Auto-Updater veröffentlichen.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Upload zur Website (Versionsverwaltung unter /admin/releases) – Secret selbst eintragen
  RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
  RELEASE_SITE: https://silentapps-minimal-labs.com
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  VERSION: 1.0.${{ github.run_number }}

jobs:
  licenses:
    name: Lizenzen prüfen (keine GPL/LGPL/AGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm-Lizenzen (nur ausgelieferte Pakete)
        run: npx -y license-checker-rseidelsohn@4 --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;MIT OR Apache-2.0;Apache-2.0 OR MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0;Zlib;OFL-1.1"

  pioneer:
    name: Pioneer-Export unabhängig prüfen (pyrekordbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testwerkzeug (nur CI, wird nicht ausgeliefert)
        run: pip install "pyrekordbox==0.5.0"
      - name: Testmusik erzeugen
        run: python scripts/make_test_music.py "$RUNNER_TEMP/musik"
      - name: Analyse + Export (Ende-zu-Ende)
        run: cargo run -p musiccore --release --example pioneer_selftest -- "$RUNNER_TEMP/musik" "$RUNNER_TEMP/pioneer"
      - name: Mit pyrekordbox prüfen
        run: python scripts/verify_pioneer.py "$RUNNER_TEMP/pioneer"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Abhängigkeiten
        run: npm ci

      - name: Version setzen und Update-Signatur prüfen
        shell: bash
        run: node scripts/ci-config.mjs

      - name: Tests (Kern)
        run: cargo test -p musiccore --release

      - name: Bauen (Installer + portable EXE)
        run: npx tauri build

      - name: Dateien einsammeln
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe "out/MinimalLibrary_${VERSION}_x64-setup.exe"
          if ls target/release/bundle/nsis/*-setup.exe.sig >/dev/null 2>&1; then cp target/release/bundle/nsis/*-setup.exe.sig "out/MinimalLibrary_${VERSION}_x64-setup.exe.sig"; fi
          cp target/release/bundle/msi/*.msi "out/MinimalLibrary_${VERSION}_x64.msi"
          cp target/release/minimal-library.exe "out/MinimalLibrary_${VERSION}_portable.exe"

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLibrary-Windows-${{ github.run_number }}
          path: out/*
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Abhängigkeiten
        run: npm ci

      - name: Version setzen und Update-Signatur prüfen
        run: node scripts/ci-config.mjs

      - name: Tests (Kern)
        run: cargo test -p musiccore --release

      - name: Apple-Signatur und Beglaubigung (nur wenn eingerichtet)
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          AT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$C" ] && [ -n "$SI" ]; then
            { echo "APPLE_CERTIFICATE=$C"; echo "APPLE_CERTIFICATE_PASSWORD=$CP"; echo "APPLE_SIGNING_IDENTITY=$SI"; } >> "$GITHUB_ENV"
            if [ -n "$AI" ]; then { echo "APPLE_ID=$AI"; echo "APPLE_PASSWORD=$AP"; echo "APPLE_TEAM_ID=$AT"; } >> "$GITHUB_ENV"; fi
            echo "Signiere mit Developer ID"
          else
            echo "Keine Apple-Zertifikate hinterlegt – App wird nur ad-hoc signiert"
          fi

      - name: Bauen (Universal – Apple Silicon + Intel)
        run: npx tauri build --target universal-apple-darwin

      - name: Dateien einsammeln
        run: |
          mkdir out
          B=target/universal-apple-darwin/release/bundle
          cp $B/dmg/*.dmg "out/MinimalLibrary_${VERSION}_universal.dmg"
          if ls $B/macos/*.app.tar.gz >/dev/null 2>&1; then
            cp $B/macos/*.app.tar.gz "out/MinimalLibrary_${VERSION}_universal.app.tar.gz"
            cp $B/macos/*.app.tar.gz.sig "out/MinimalLibrary_${VERSION}_universal.app.tar.gz.sig"
          fi

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLibrary-Mac-${{ github.run_number }}
          path: out/*
          retention-days: 30

  release:
    needs: [windows, macos, licenses, pioneer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Signatur vorhanden?
        id: key
        run: |
          echo "ok=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "site=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$RELEASE_UPLOAD_TOKEN" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == '1'
        with:
          path: dl
          merge-multiple: true

      - name: Release v${{ env.VERSION }} mit latest.json
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cd dl
          base="https://github.com/$REPO/releases/download/v$VERSION"
          win="MinimalLibrary_${VERSION}_x64-setup.exe"
          mac="MinimalLibrary_${VERSION}_universal.app.tar.gz"
          jq -n \
            --arg v "$VERSION" \
            --arg notes "$(printf '%s' "$NOTES" | head -n 1)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ws "$(cat "$win.sig")" --arg wu "$base/$win" \
            --arg ms "$(cat "$mac.sig")" --arg mu "$base/$mac" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{
              "windows-x86_64":{signature:$ws, url:$wu},
              "darwin-aarch64":{signature:$ms, url:$mu},
              "darwin-x86_64":{signature:$ms, url:$mu}}}' > latest.json
          cat latest.json
          gh release create "v$VERSION" -R "$REPO" --target "$GITHUB_SHA" --title "Minimal Library $VERSION" \
            --notes "$(printf '%s' "$NOTES" | head -n 1)" \
            "$win" "$win.sig" "MinimalLibrary_${VERSION}_x64.msi" "MinimalLibrary_${VERSION}_portable.exe" \
            "MinimalLibrary_${VERSION}_universal.dmg" "$mac" "$mac.sig" latest.json

      - name: Auf die Website hochladen (als neue Version, noch nicht aktiv)
        if: steps.key.outputs.site == '1'
        # Website nicht erreichbar → Build bleibt trotzdem grün (Hinweis im Log)
        continue-on-error: true
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd dl
          api="$RELEASE_SITE/api/releases/minimal-library"
          auth="Authorization: Bearer $RELEASE_UPLOAD_TOKEN"
          # Erst prüfen, ob die Website von GitHub aus erreichbar ist und den Upload kennt
          probe=$(curl -4 -sS -o /tmp/p.txt -w '%{http_code}' --connect-timeout 20 -X POST "$api/finish" -H "$auth" -H "Content-Type: application/json" --data '{}' || echo 000)
          echo "Website-Test: HTTP $probe – $(head -c 200 /tmp/p.txt 2>/dev/null)"
          if [ "$probe" = "000" ]; then echo "::warning::Website $RELEASE_SITE von GitHub aus nicht erreichbar (Verbindung abgelehnt/Zeitüberschreitung)"; exit 1; fi
          if [ "$probe" = "404" ]; then echo "::warning::Upload-Adresse $api/finish gibt es auf der Website noch nicht"; exit 1; fi
          if [ "$probe" = "401" ]; then echo "::warning::Upload-Token passt nicht zur Website"; exit 1; fi
          files=(
            "MinimalLibrary_${VERSION}_x64-setup.exe|windows|setup"
            "MinimalLibrary_${VERSION}_x64.msi|windows|msi"
            "MinimalLibrary_${VERSION}_portable.exe|windows|portable"
            "MinimalLibrary_${VERSION}_universal.dmg|mac|dmg"
            "MinimalLibrary_${VERSION}_universal.app.tar.gz|mac|updater"
          )
          list="[]"
          for f in "${files[@]}"; do
            IFS='|' read -r name platform kind <<< "$f"
            rm -rf parts && mkdir parts
            split -b 8m -d -a 4 "$name" parts/p
            n=$(ls parts | wc -l)
            i=0
            for part in $(ls parts | sort); do
              # Der Server lässt Verbindungen ab und zu kurz nicht zu – geduldig wiederholen
              for try in 1 2 3 4 5 6 7 8; do
                code=$(curl -4 -sS --connect-timeout 20 --max-time 300 -o /tmp/r.txt -w '%{http_code}' -X POST "$api/chunk" -H "$auth" \
                  -H "X-Version: $VERSION" -H "X-File: $name" -H "X-Chunk: $i" -H "X-Chunks: $n" \
                  -H "Content-Type: application/octet-stream" --data-binary "@parts/$part") || code=000
                [ "$code" = "200" ] && break
                echo "Teil $i von $name: HTTP $code – $(head -c 300 /tmp/r.txt)"; rm -f /tmp/r.txt; sleep $(( try * 10 > 60 ? 60 : try * 10 ))
              done
              [ "$code" = "200" ] || exit 1
              i=$((i + 1))
            done
            sig=""; [ -f "$name.sig" ] && sig=$(cat "$name.sig")
            list=$(jq -c --arg n "$name" --arg p "$platform" --arg k "$kind" --arg sha "$(sha256sum "$name" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$name")" --arg sig "$sig" '. + [{name:$n, platform:$p, kind:$k, sha256:$sha, size:$size, signature:$sig}]' <<< "$list")
          done
          jq -n --arg v "$VERSION" --arg notes "$(printf '%s' "$NOTES" | head -n 1)" --arg commit "$GITHUB_SHA" \
            --argjson run "$GITHUB_RUN_NUMBER" --argjson files "$list" \
            '{version:$v, notes:$notes, commit:$commit, run:$run, files:$files}' > finish.json
          code=$(curl -4 -sS --connect-timeout 20 --max-time 600 -o /tmp/r.txt -w '%{http_code}' -X POST "$api/finish" -H "$auth" -H "Content-Type: application/json" --data-binary @finish.json)
          cat /tmp/r.txt; echo
          [ "$code" = "200" ]
