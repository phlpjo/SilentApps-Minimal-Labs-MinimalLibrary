[package]
name = "musiccore"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
trash = "5"
base64 = "0.22"
lofty = "0.25.5"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustfft = "6.4.1"
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.1"
notify-debouncer-full = "0.8"
tiny_http = "0.12.0"
roxmltree = "0.21.2"
if-addrs = "0.15.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
