# Lizenzprüfung (cargo-deny). Minimal Library wird mit geschlossenem Quellcode verkauft:
# keine GPL/LGPL/AGPL-Abhängigkeiten. Neue Abhängigkeiten nur unter den hier erlaubten Lizenzen.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  # Unicode-Datentabellen (ICU, unicode-ident) – freizügig, keine Copyleft-Pflichten
  "Unicode-3.0",
  # gemeinfrei/freizügig
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
]

# Eigene, nicht veröffentlichte Pakete (proprietär, siehe LICENSE) nicht prüfen
[licenses.private]
ignore = true

# Einzeln geprüfte Ausnahmen (freizügig, kein Copyleft):
[[licenses.exceptions]]
# SQLCipher Community Edition (BSD-3-Clause) mit SQLite („blessing“, gemeinfrei) und
# libtomcrypt-Quellen (gemeinfrei/WTFPL) – für die verschlüsselte OneLibrary-Datenbank
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[[licenses.exceptions]]
# Mozilla-Wurzelzertifikate als Daten (für HTTPS in ureq) – freizügige Datenlizenz
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
# GPL, LGPL, AGPL u. Ä. sind nicht erlaubt – alles, was nicht oben steht, schlägt fehl.

[bans]
multiple-versions = "allow"
deny = [
  # GPL-3.0 – ausdrücklich verboten
  { name = "rbox" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
