[package]
name = "mlserver"
version = "1.0.0"
description = "Minimal Library für Synology DSM – dieselbe Bibliothek, Oberfläche im Browser"
edition = "2024"
publish = false

[[bin]]
name = "minimal-library-server"
path = "src/main.rs"

[dependencies]
musiccore = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
trash = "5"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
tiny_http = "0.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"

[build-dependencies]
syn = { version = "2", features = ["full", "visit-mut", "printing", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
